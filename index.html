<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#1D9E75">
  <title>Budget 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-screen" class="auth-screen"><div class="auth-content"><div class="auth-logo">💰</div><h1 class="auth-title">Budget 2026</h1><p class="auth-sub">Connecte-toi avec Google pour accéder à ton suivi budgétaire</p><button id="btn-login" class="btn-login">Se connecter avec Google</button></div></div>
<div id="app" class="app hidden">
  <div class="header"><div class="header-nav"><button id="btn-month-prev" class="month-nav-btn"><i class="ti ti-chevron-left"></i></button><div><div id="header-month" class="header-title">—</div><div id="header-sub" class="header-sub">Chargement...</div></div><button id="btn-month-next" class="month-nav-btn"><i class="ti ti-chevron-right"></i></button></div><div class="header-actions"><button id="btn-refresh" class="icon-btn"><i class="ti ti-refresh"></i></button><button id="btn-settings" class="icon-btn"><i class="ti ti-settings"></i></button><button id="btn-logout" class="icon-btn"><i class="ti ti-logout"></i></button></div></div>
  <div class="nav"><button class="nav-btn active" data-screen="dashboard">Dashboard</button><button class="nav-btn" data-screen="transactions">Dépenses</button><button class="nav-btn" data-screen="stats">Stats</button><button class="nav-btn" data-screen="annuel">Annuel</button></div>
  <div id="screen-dashboard" class="screen active"><div class="section-title">Soldes</div><div class="soldes"><div class="solde-card">Perso <span id="perso-today">—</span><span id="perso-eom">—</span></div><div class="solde-card">Joint <span id="joint-today">—</span><span id="joint-eom">—</span></div><div class="solde-card wide">Épargne <span id="epargne-val">—</span></div></div><div class="section-title">Répartition <span id="label-user1">Yoann</span> / <span id="label-user2">Élodie</span></div><div class="repartition"><span id="avatar-y">YO</span><span id="repname-y">Yoann</span><span id="rep-y">—</span><div id="rep-bar-y"></div><span id="avatar-e">ÉL</span><span id="repname-e">Élodie</span><span id="rep-e">—</span><div id="rep-bar-e"></div></div><div id="budget-bars" class="budget-bars"></div><button id="fab-dashboard" class="fab-btn">Ajouter</button></div>
  <div id="screen-transactions" class="screen"><div class="compte-tabs"><button class="compte-tab active" data-compte="joint">Joint</button><button class="compte-tab" data-compte="perso">Perso</button><button class="compte-tab" data-compte="epargne">Épargne</button></div><div id="tx-list" class="transactions"></div><button id="fab-tx" class="fab-btn">Ajouter</button></div>
  <div id="screen-stats" class="screen"><div id="stats-bars" class="budget-bars"></div><div id="chart-tabs" class="chart-tabs"><button class="chart-tab active" data-compte="joint">Joint</button><button class="chart-tab" data-compte="perso">Perso</button></div><div class="chart-card"><canvas id="chart-depenses"></canvas><div id="chart-legend"></div></div><button id="fab-stats" class="fab-btn">Ajouter</button></div>
  <div id="screen-annuel" class="screen"><div id="annuel-content"></div><button id="fab-annuel" class="fab-btn">Ajouter</button></div>
</div>
<div id="modal-settings" class="modal-overlay"><div class="modal"><div class="modal-title">⚙️ Paramètres</div><div class="settings-version"><span>Version app</span><strong id="app-version-value">—</strong></div><button id="btn-force-update" class="submit-btn secondary-btn" type="button">Forcer la mise à jour</button><input id="settings-name1" placeholder="Yoann"><input id="settings-name2" placeholder="Élodie"><input id="settings-email2" placeholder="Email"><div id="chips-seuil" class="chips"><button class="chip" data-val="70">70%</button><button class="chip selected" data-val="80">80%</button><button class="chip" data-val="90">90%</button></div><div id="chips-comparaison" class="chips"><button class="chip selected" data-val="prev_month">Mois précédent</button><button class="chip" data-val="prev_year">Même mois N-1</button><button class="chip" data-val="none">Aucune</button></div><input id="budget-courses"><input id="budget-carburant"><input id="budget-autre"><button id="btn-save-settings" class="submit-btn">Enregistrer</button><p id="next-month-info"></p><button id="btn-prepare-month" class="submit-btn"><span id="btn-prepare-label">Préparer</span></button></div></div>
<div id="modal" class="modal-overlay"><div class="modal"><div class="modal-title">Nouvelle opération</div><div id="chips-compte" class="chips"><button class="chip selected" data-val="Compte Joint">Compte Joint</button><button class="chip" data-val="Compte Perso">Compte Perso</button><button class="chip" data-val="Épargne">Épargne</button></div><div id="chips-type" class="chips"><button class="chip selected" data-val="Charge variable">Charge variable</button><button class="chip" data-val="Charge fixe">Charge fixe</button><button class="chip" data-val="Revenu">Revenu</button><button class="chip" data-val="Dépense">Dépense</button></div><input id="input-montant" type="number"><input id="input-date" type="date"><input id="input-libelle"><div id="chips-cat" class="chips"><button class="chip selected" data-val="Courses">Courses</button><button class="chip" data-val="Carburant/transport">Carburant</button><button class="chip" data-val="Autre">Autre</button></div><select id="input-mois"><option>Janvier</option><option>Février</option><option>Mars</option><option>Avril</option><option>Mai</option><option selected>Juin</option><option>Juillet</option><option>Aout</option><option>Septembre</option><option>Octobre</option><option>Novembre</option><option>Décembre</option></select><div id="submit-error" class="submit-error hidden"></div><button id="btn-submit" class="submit-btn"><span id="btn-submit-label">Enregistrer</span></button></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><script src="app.js"></script>
</body></html>
